# Dependencies of cadenway-search-service for working on it alone: its own PostgreSQL database,
# NATS JetStream and Meilisearch. The service itself runs on the host with `pnpm start:dev`.
#
# The credentials below are local development values, matching .env.example. PostgreSQL has the two
# roles of cadenway-ops (docs/database.md there): search_migrator owns the database and runs the
# DDL; search_app runs the service, owns nothing and is subject to row-level security. The roles are
# created when the data volume is empty: after pulling this change, recreate an older volume once
# with `docker compose -f compose.dev.yaml down --volumes`.
name: cadenway-search-service-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    configs:
      - source: service-roles
        target: /docker-entrypoint-initdb.d/10-service-roles.sql
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during the first start the image runs the init scripts on a server that listens on
      # its socket only, so the roles exist once TCP answers.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d search']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    # The user of this service, as on the servers: a connection without it is refused.
    command:
      [
        '--jetstream',
        '--store_dir',
        '/data',
        '--http_port',
        '8222',
        '--user',
        'search',
        '--pass',
        'search',
      ]
    ports:
      - '127.0.0.1:${DEV_NATS_PORT:-4222}:4222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # The engine of the search index, the image of cadenway-ops (compose/infra.yaml there), in
  # development mode with the local master key of .env.example.
  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-development-master-key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${DEV_MEILI_PORT:-7700}:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

configs:
  service-roles:
    content: |
      CREATE ROLE search_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'search_migrator';
      CREATE ROLE search_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'search_app';
      ALTER ROLE search_migrator SET statement_timeout = '15min';
      ALTER ROLE search_migrator SET lock_timeout = '5s';
      ALTER ROLE search_migrator SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE search_app SET statement_timeout = '10s';
      ALTER ROLE search_app SET lock_timeout = '5s';
      ALTER ROLE search_app SET idle_in_transaction_session_timeout = '30s';
      ALTER DATABASE search OWNER TO search_migrator;
      REVOKE ALL ON DATABASE search FROM PUBLIC;
      GRANT CONNECT ON DATABASE search TO search_app;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO search_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE search_migrator GRANT USAGE ON SCHEMAS TO search_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE search_migrator
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO search_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE search_migrator
        GRANT USAGE, SELECT ON SEQUENCES TO search_app;

volumes:
  postgres-data:
  nats-data:
  meilisearch-data:

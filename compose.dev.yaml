# Dependencies of cadenway-search-service for working on it alone: its own PostgreSQL database,
# NATS JetStream with the streams of cadenway-ops, and Meilisearch. The service itself runs on the
# host with `pnpm start:dev`; tests/service-wiring.int-spec.ts starts this file as a throwaway
# project.
#
# The credentials below are local development values, matching .env.example. PostgreSQL has the two
# roles of cadenway-ops (docs/database.md there): search_migrator owns the database and runs the
# DDL; search_app runs the service, owns nothing, reads and writes the rows of the `public` schema
# only (never the journal of drizzle-kit, in `drizzle`) and is subject to row-level security. The
# roles are created when the data volume is empty: after pulling this change, recreate an older
# volume once with `docker compose -f compose.dev.yaml down --volumes`.
#
# NATS runs with the authorization of the broker of cadenway-ops (docs/messaging.md and
# compose/nats/nats-server.conf there): a connection without a user is refused, and the `search`
# user has the same permissions as there. It publishes nothing but the JetStream API of a consumer
# of EVENTS, and subscribes to its own inbox prefix `_INBOX.search.>` and to `rebuild.search.>`
# only. When cadenway-ops changes those permissions, change them here too. `admin` stands for the
# user of the `nats-streams` container of cadenway-ops.
#
# The streams: `nats-streams` runs compose/nats/ensure-streams.sh of cadenway-ops, copied below, as
# `admin`, the way the `nats-streams` container of cadenway-ops does. It creates EVENTS,
# EVENTS_RESTRICTED and EVENTS_DLQ (or aligns them) once NATS is healthy, then checks every minute
# that they exist, and is healthy while they do, so `up --wait` returns once the streams are in
# place. A one-shot container would make `up --wait` fail when it exits. The service never creates
# a stream itself (`manageStreams: false`): it refuses to start without EVENTS.
name: cadenway-search-service-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    configs:
      - source: service-roles
        target: /docker-entrypoint-initdb.d/10-service-roles.sql
    ports:
      - '127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during the first start the image runs the init scripts on a server that listens on
      # its socket only, so the roles exist once TCP answers.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d search']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ['--config', '/etc/nats/nats-server.conf']
    configs:
      - source: nats-server
        target: /etc/nats/nats-server.conf
    ports:
      - '127.0.0.1:${DEV_NATS_PORT:-4222}:4222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  # The engine of the search index, the image of cadenway-ops (compose/infra.yaml there), in
  # development mode with the local master key of .env.example.
  meilisearch:
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-development-master-key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:${DEV_MEILI_PORT:-7700}:7700'
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

  nats-streams:
    image: natsio/nats-box:0.20.2-nonroot@sha256:d00bffed51ea1a29e58852698bde37020d306af55585882f88dbcf09dd86f5fe
    entrypoint: ['/bin/sh', '/etc/nats/ensure-streams.sh']
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: admin
      NATS_PASSWORD: admin
    configs:
      - source: ensure-streams
        target: /etc/nats/ensure-streams.sh
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'test', '-e', '/tmp/streams-ready']
      interval: 2s
      timeout: 3s
      retries: 15

configs:
  service-roles:
    content: |
      CREATE ROLE search_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'search_migrator';
      CREATE ROLE search_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS
        PASSWORD 'search_app';
      ALTER ROLE search_migrator SET statement_timeout = '15min';
      ALTER ROLE search_migrator SET lock_timeout = '5s';
      ALTER ROLE search_migrator SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE search_app SET statement_timeout = '10s';
      ALTER ROLE search_app SET lock_timeout = '5s';
      ALTER ROLE search_app SET idle_in_transaction_session_timeout = '30s';
      ALTER DATABASE search OWNER TO search_migrator;
      REVOKE ALL ON DATABASE search FROM PUBLIC;
      GRANT CONNECT ON DATABASE search TO search_app;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO search_app;
      -- Rows, never structure, and only in `public`, as cadenway-ops grants them
      -- (compose/postgres/init/10-service-databases.sh): the journal of drizzle-kit lives in the
      -- `drizzle` schema, and the application role must never rewrite it.
      ALTER DEFAULT PRIVILEGES FOR ROLE search_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO search_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE search_migrator IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO search_app;

  # `$$` is a literal `$` for Compose; the server reads the quoted `$JS...` subjects as they are.
  nats-server:
    content: |
      port: 4222
      http_port: 8222

      jetstream {
        store_dir: /data
      }

      authorization {
        users = [
          { user: admin, password: admin, permissions: { publish: ">", subscribe: ">" } }

          {
            user: search
            password: search
            permissions: {
              publish: {
                allow: [
                  "$$JS.API.INFO", "$$JS.API.STREAM.NAMES", "$$JS.API.STREAM.INFO.EVENTS",
                  "$$JS.API.CONSUMER.CREATE.EVENTS.>", "$$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.*",
                  "$$JS.API.CONSUMER.INFO.EVENTS.*", "$$JS.API.CONSUMER.MSG.NEXT.EVENTS.*",
                  "$$JS.ACK.EVENTS.>"
                ]
              }
              subscribe: { allow: ["_INBOX.search.>", "rebuild.search.>"] }
            }
          }
        ]
      }

  # compose/nats/ensure-streams.sh of cadenway-ops, with `$$` for each `$`; keep the two aligned.
  ensure-streams:
    content: |
      set -eu

      readonly READY=/tmp/streams-ready
      readonly CHECK_INTERVAL=60
      readonly RETRY_INTERVAL=5

      # Creates a stream, or updates it when it exists.
      # Arguments: name, subjects, maximum age, maximum size in bytes, description.
      ensure_stream() {
        name=$$1
        subjects=$$2
        max_age=$$3
        max_bytes=$$4
        description=$$5

        if nats stream info "$$name" >/dev/null 2>&1; then
          nats stream edit "$$name" --force \
            --subjects "$$subjects" --description "$$description" \
            --max-age "$$max_age" --max-bytes "$$max_bytes" --dupe-window 2m >/dev/null
        else
          nats stream add "$$name" --defaults \
            --subjects "$$subjects" --description "$$description" \
            --storage file --retention limits --discard old --replicas 1 \
            --max-age "$$max_age" --max-bytes "$$max_bytes" --dupe-window 2m \
            --max-msgs=-1 --max-msgs-per-subject=-1 --max-msg-size=-1 >/dev/null
        fi
      }

      ensure_streams() {
        ensure_stream EVENTS 'evt.>' 7d 1GiB \
          'Every Cadenway event.' &&
          ensure_stream EVENTS_RESTRICTED 'restricted.>' 7d 64MiB \
            'Identity events carrying a single-use code or link; read by notification-service only.' &&
          ensure_stream EVENTS_DLQ 'dlq.>' 30d 256MiB \
            'Messages a consumer gave up on, copied by the dead-letter worker.'
      }

      streams_exist() {
        nats stream info EVENTS >/dev/null 2>&1 &&
          nats stream info EVENTS_RESTRICTED >/dev/null 2>&1 &&
          nats stream info EVENTS_DLQ >/dev/null 2>&1
      }

      # `sleep` runs in the background so the shell, as process 1, answers the stop signal at once.
      trap 'exit 0' TERM INT
      pause() {
        sleep "$$1" &
        wait $$!
      }

      rm -f "$$READY"
      while :; do
        if [ -e "$$READY" ] && streams_exist; then
          pause "$$CHECK_INTERVAL"
        elif ensure_streams; then
          echo 'nats-streams: EVENTS, EVENTS_RESTRICTED and EVENTS_DLQ are in place.'
          : >"$$READY"
          pause "$$CHECK_INTERVAL"
        else
          rm -f "$$READY"
          echo 'nats-streams: the streams are not in place yet; trying again.' >&2
          pause "$$RETRY_INTERVAL"
        fi
      done

volumes:
  postgres-data:
  nats-data:
  meilisearch-data:

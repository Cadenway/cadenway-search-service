# Definition of search-service for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/search-service.yaml for the environment it deploys to.
#
# Internal service: no Traefik label, no published port. Secret values (the database URLs and the
# NATS password) are referenced by name; they live in cadenway-ops, which documents every variable
# below in docs/service-environment.md. The GitOps agent refuses a commit that leaves a required
# variable unset.
#
# INTERNAL_TOKEN_TRUSTED_ISSUERS lists who may call this service: the API gateway only. The folded
# scalar gives the service one line of JSON.
#
# The optional SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK enables the four signed outbound
# connections. Their defaults use the owning services on the internal network.
#
# MEILI_URL and MEILI_API_KEY configure Meilisearch for the index and readiness check.
#
# MIGRATION_DATABASE_URL is deliberately absent: the GitOps agent of cadenway-ops hands the
# migrator's URL to the one-off migration container only (docs/database.md there), so the running
# service never holds the owner credentials of its schema.
services:
  search-service:
    image: ghcr.io/${GHCR_OWNER}/cadenway-search-service:${SEARCH_SERVICE_VERSION}
    restart: unless-stopped
    environment:
      PORT: '3019'
      DATABASE_URL: ${SEARCH_SERVICE_DATABASE_URL}
      NATS_URL: ${NATS_URL}
      NATS_USER: search
      NATS_PASSWORD: ${SEARCH_NATS_PASSWORD}
      INTERNAL_TOKEN_AUDIENCE: search-service
      INTERNAL_TOKEN_TRUSTED_ISSUERS: >-
        {"api-gateway": [${API_GATEWAY_INTERNAL_TOKEN_PUBLIC_JWKS}]}
      INTERNAL_TOKEN_PRIVATE_JWK: ${SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:-}
      SEARCH_PALETTE_CURSOR_SECRET: ${SEARCH_SERVICE_PALETTE_CURSOR_SECRET:-}
      TASK_SERVICE_URL: ${SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:+${TASK_SERVICE_URL:-http://task-service:3013}}
      ORGANIZATION_SERVICE_URL: ${SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:+${ORGANIZATION_SERVICE_URL:-http://organization-service:3011}}
      DOCUMENT_SERVICE_URL: ${SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:+${DOCUMENT_SERVICE_URL:-http://document-service:3014}}
      STORAGE_SERVICE_URL: ${SEARCH_SERVICE_INTERNAL_TOKEN_PRIVATE_JWK:+${STORAGE_SERVICE_URL:-http://storage-service:3015}}
      MEILI_URL: ${MEILI_URL}
      MEILI_API_KEY: ${MEILI_MASTER_KEY}
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3019/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Declared identically by cadenway-ops and by every service definition it includes.
networks:
  internal: {}
